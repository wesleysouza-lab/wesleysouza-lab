<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Capability gauges: Python, SQL, Cloud, AI agents">
  <defs>
    <style>
      .bg { fill: #16181d; }
      .track { fill: none; stroke: #2c2f36; stroke-width: 10; }
      .arc { fill: none; stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transform-box: fill-box; stroke-dasharray: 0 100; animation: fill 1.8s ease-out forwards; }
      .red { stroke: #c8102e; }
      .gold { stroke: #f5b700; }
      @keyframes fill { to { stroke-dasharray: var(--v) 100; } }
      .num { font: 300 28px 'Segoe UI', Arial, sans-serif; fill: #f4efe6; text-anchor: middle; }
      .name { font: 600 12px 'Consolas', 'Courier New', monospace; fill: #b9a99a; letter-spacing: 3px; text-anchor: middle; }
      .cap { font: 600 12px 'Consolas', 'Courier New', monospace; fill: #f5b700; letter-spacing: 4px; }
    </style>
  </defs>
  <rect class="bg" width="900" height="210" rx="8"/>
  <text x="28" y="30" class="cap">CAPABILITY READOUT</text>

  <g transform="translate(150 110)">
    <circle class="track" r="46"/>
    <circle class="arc red" r="46" pathLength="100" style="--v:90"/>
    <text class="num" y="10">90</text>
    <text class="name" y="82">PYTHON</text>
  </g>
  <g transform="translate(375 110)">
    <circle class="track" r="46"/>
    <circle class="arc gold" r="46" pathLength="100" style="--v:85"/>
    <text class="num" y="10">85</text>
    <text class="name" y="82">SQL / BIGQUERY</text>
  </g>
  <g transform="translate(600 110)">
    <circle class="track" r="46"/>
    <circle class="arc red" r="46" pathLength="100" style="--v:75"/>
    <text class="num" y="10">75</text>
    <text class="name" y="82">CLOUD RUN</text>
  </g>
  <g transform="translate(790 110)">
    <circle class="track" r="46"/>
    <circle class="arc gold" r="46" pathLength="100" style="--v:80"/>
    <text class="num" y="10">80</text>
    <text class="name" y="82">AI AGENTS</text>
  </g>
</svg>

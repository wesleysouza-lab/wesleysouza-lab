<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="⚔ GHOST OF SPARTA. A warrior who left Olympus and rebuilt his life in Midgard carries both worlds with him. So does this profile: Greek strategy and Norse architecture, forged into one way of working. Patience before the strike, and no mercy for bugs.">

<text x="36" y="38" font-family="'Consolas','SF Mono','Courier New',monospace" font-size="11" letter-spacing="5" fill="#d0312d">⚔ GHOST OF SPARTA</text><text x="36" y="70" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e8ecf3">A warrior who left Olympus and rebuilt his life in Midgard carries both worlds with him.</text><text x="36" y="96" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e8ecf3">So does this profile: Greek strategy and Norse architecture, forged into one way of</text><text x="36" y="122" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e8ecf3">working. Patience before the strike, and no mercy for bugs.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Good morning, Wesley. Briefing ready.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181d"/>
      <stop offset="1" stop-color="#2a1216"/>
    </linearGradient>
    <style>
      .rot { transform-origin: 730px 130px; animation: rot 30s linear infinite; }
      .rot2 { transform-origin: 730px 130px; animation: rot 18s linear infinite reverse; }
      @keyframes rot { to { transform: rotate(360deg); } }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      .small { font: 600 12px 'Consolas', 'Courier New', monospace; fill: #f5b700; letter-spacing: 4px; }
      .hello { font: 300 40px 'Segoe UI', Arial, sans-serif; fill: #f4efe6; }
      .hello b { font-weight: 700; }
      .meta { font: 400 14px 'Consolas', 'Courier New', monospace; fill: #b9a99a; }
    </style>
  </defs>
  <rect width="900" height="260" fill="url(#bg)"/>
  <path d="M0 0H900V6H0Z" fill="#c8102e"/>
  <path d="M0 254H900V260H0Z" fill="#f5b700"/>

  <g fill="none" stroke-linecap="round">
    <g class="rot">
      <polygon points="730,50 799,90 799,170 730,210 661,170 661,90" stroke="#c8102e" stroke-width="3" stroke-dasharray="70 18"/>
    </g>
    <g class="rot2">
      <polygon points="730,76 776,103 776,157 730,184 684,157 684,103" stroke="#f5b700" stroke-width="2" stroke-dasharray="26 10"/>
    </g>
    <path d="M730 20V44M730 216V240M600 130H636M824 130H860" stroke="#f5b700" stroke-width="2"/>
    <circle cx="730" cy="130" r="22" stroke="#f4efe6" stroke-width="2"/>
  </g>
  <circle cx="730" cy="130" r="6" fill="#c8102e"/>

  <text x="48" y="74" class="small">PERSONAL AI ASSISTANT</text>
  <text x="48" y="130" class="hello">Good morning, <tspan font-weight="700">Wesley.</tspan></text>
  <text x="48" y="168" class="meta">Briefing ready. Everything is in order.</text>
  <text x="48" y="204" class="meta">Awaiting your command<tspan class="blink">_</tspan></text>
</svg>

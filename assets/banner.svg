<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="W.E.S.L.E.Y. AI interface: online, good day, Wesley">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ff4ff"/>
      <stop offset="0.45" stop-color="#27d3ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#27d3ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0e3a52" stroke-width="1"/>
    </pattern>
    <style>
      .spin1 { transform-origin: 730px 140px; animation: spin 24s linear infinite; }
      .spin2 { transform-origin: 730px 140px; animation: spin 16s linear infinite reverse; }
      .spin3 { transform-origin: 730px 140px; animation: spin 40s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 730px 140px; }
      @keyframes pulse { 50% { opacity: .55; } }
      .scan { animation: scan 5s ease-in-out infinite alternate; }
      @keyframes scan { from { transform: translateY(0); } to { transform: translateY(250px); } }
      .tag { font: 600 13px 'Consolas', 'Courier New', monospace; fill: #5fdcff; letter-spacing: 5px; }
      .title { font: 700 44px 'Segoe UI', Arial, sans-serif; fill: #e9fbff; letter-spacing: 3px; }
      .line { font: 400 16px 'Consolas', 'Courier New', monospace; fill: #9fdcec; }
      .gold { fill: #ffc83d; }
    </style>
  </defs>
  <rect width="900" height="280" fill="#050d17"/>
  <rect width="900" height="280" fill="url(#grid)"/>
  <rect class="scan" x="0" y="10" width="900" height="2" fill="#27d3ff" opacity=".35"/>

  <circle class="pulse" cx="730" cy="140" r="130" fill="url(#glow)"/>
  <g fill="none" stroke="#27d3ff">
    <circle class="spin3" cx="730" cy="140" r="118" stroke-width="2" stroke-dasharray="3 9"/>
    <circle class="spin1" cx="730" cy="140" r="96" stroke-width="5" stroke-dasharray="90 24 40 24"/>
    <circle class="spin2" cx="730" cy="140" r="70" stroke-width="3" stroke-dasharray="22 12"/>
    <circle cx="730" cy="140" r="44" stroke-width="2" stroke="#ffc83d"/>
  </g>
  <g class="spin2" fill="#ffc83d">
    <polygon points="730,104 744,152 716,152"/>
  </g>
  <circle cx="730" cy="140" r="14" fill="#e9fbff"/>

  <text x="44" y="70" class="tag">SYSTEM ONLINE</text>
  <text x="44" y="128" class="title">W.E.S.L.E.Y.</text>
  <text x="44" y="164" class="line">Wesley's Engineering and Systems Logic Engine</text>
  <text x="44" y="206" class="line">Good day. All systems nominal.</text>
  <rect class="gold" x="44" y="224" width="120" height="3"/>
</svg>

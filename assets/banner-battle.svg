<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Battle scene: an original hooded shadow hunter with two daggers strikes a dungeon creature, with purple aura and rising shadows. System window: player wesleysouza-lab, class Shadow Monarch, system online, level up, new quest available.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05040a"/>
      <stop offset="0.7" stop-color="#140a26"/>
      <stop offset="1" stop-color="#07060b"/>
    </linearGradient>
    <radialGradient id="gate" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2e1065" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b21b6" stop-opacity="0"/>
      <stop offset="1" stop-color="#5b21b6" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="tendril" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1e1036"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="frame"><path d="M16 1H884L899 16V284L884 299H16L1 284V16Z"/></clipPath>

    <!-- original hooded hunter, feet at origin, facing right -->
    <g id="hunter">
      <path d="M6 -108C-20 -100 -52 -86 -80 -66C-64 -68 -48 -62 -42 -54C-30 -68 -10 -76 4 -70Z" fill="#05030a" stroke="#8b5cf6" stroke-width="1.2">
        <animate attributeName="d" dur="0.9s" repeatCount="indefinite" values="M6 -108C-20 -100 -52 -86 -80 -66C-64 -68 -48 -62 -42 -54C-30 -68 -10 -76 4 -70Z;M6 -108C-22 -104 -56 -96 -86 -82C-68 -80 -52 -70 -44 -60C-32 -72 -12 -78 4 -70Z;M6 -108C-20 -100 -52 -86 -80 -66C-64 -68 -48 -62 -42 -54C-30 -68 -10 -76 4 -70Z"/>
      </path>
      <path d="M14 -66L44 -40L66 -2" fill="none" stroke="#05030a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 -64L-16 -36L-48 -6" fill="none" stroke="#05030a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 -112L36 -106L24 -64L2 -68Z" fill="#05030a" stroke="#8b5cf6" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M32 -104L72 -96" fill="none" stroke="#05030a" stroke-width="8" stroke-linecap="round"/>
      <path d="M8 -104L-26 -86" fill="none" stroke="#05030a" stroke-width="8" stroke-linecap="round"/>
      <path d="M8 -138C14 -148 32 -146 36 -134C38 -126 34 -118 28 -114L10 -112C0 -116 -2 -126 -12 -126C-6 -130 2 -134 8 -138Z" fill="#05030a" stroke="#8b5cf6" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M24 -128L33 -126L25 -123Z" fill="#60a5fa"><animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M70 -100L108 -112L74 -92Z" fill="#c4b5fd"/>
      <path d="M-26 -88L-38 -58L-22 -84Z" fill="#c4b5fd"/>
    </g>

    <!-- original dungeon creature, feet at origin, facing left -->
    <g id="beast">
      <path d="M-30 -112C-60 -112 -82 -98 -98 -82L-104 -70L-92 -74L-96 -62L-84 -70C-70 -84 -50 -92 -28 -94Z" fill="#0a0612" stroke="#4c1d95"/>
      <path d="M-46 0L-38 -60C-50 -100 -30 -150 10 -160C42 -166 72 -140 76 -100L82 -40L72 0H44L38 -40H12L6 0Z" fill="#0a0612" stroke="#4c1d95" stroke-width="1.5"/>
      <path d="M-8 -152L-30 -192L-2 -160Z" fill="#0a0612" stroke="#4c1d95"/>
      <path d="M24 -160L42 -200L40 -158Z" fill="#0a0612" stroke="#4c1d95"/>
      <path d="M-18 -138L-8 -134L-18 -131Z" fill="#ef4444"/>
      <path d="M6 -140L16 -136L6 -133Z" fill="#ef4444"/>
    </g>
  </defs>

  <rect width="900" height="300" fill="url(#sky)"/>

  <g clip-path="url(#frame)">
    <!-- dungeon backdrop -->
    <g fill="#0b0716" stroke="#2a1a4a">
      <path d="M560 260V60L578 44L596 60V260Z"/>
      <path d="M850 260V40L868 24L886 40V260Z"/>
      <path d="M420 260V100L432 90L444 100V260Z" opacity="0.6"/>
    </g>
    <ellipse cx="770" cy="150" rx="78" ry="110" fill="url(#gate)">
      <animate attributeName="rx" values="70;84;70" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="770" cy="150" rx="66" ry="98" fill="none" stroke="#c4b5fd" stroke-opacity="0.35" stroke-dasharray="8 10">
      <animateTransform attributeName="transform" type="rotate" from="0 770 150" to="360 770 150" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ground and fog -->
    <path d="M0 262H900V300H0Z" fill="#07050d"/>
    <path d="M0 262H900" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <rect x="0" y="200" width="900" height="70" fill="url(#fog)"/>

    <!-- shadows rising from the ground -->
    <g fill="url(#tendril)" filter="url(#soft)">
      <path d="M420 262C416 230 428 214 424 186C436 210 434 236 440 262Z"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></path>
      <path d="M450 262C444 222 460 200 452 168C470 198 466 232 474 262Z"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.1s" repeatCount="indefinite"/></path>
      <path d="M380 262C376 236 386 222 382 200C394 220 392 242 398 262Z"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></path>
      <path d="M600 262C596 238 606 226 602 206C614 226 612 244 618 262Z"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#140a26" stroke="#7c3aed" stroke-opacity="0.6">
      <path d="M352 262C350 244 356 236 362 236C368 236 372 244 370 262Z"><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.3;0.8;1" dur="5s" repeatCount="indefinite"/></path>
      <path d="M362 238L366 232L368 238Z" fill="#e879f9" stroke="none"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3;0.8;1" dur="5s" repeatCount="indefinite"/></path>
    </g>

    <!-- aura behind the hunter -->
    <ellipse cx="520" cy="200" rx="90" ry="80" fill="url(#aura)">
      <animate attributeName="ry" values="70;92;70" dur="2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- creature with knockback and hit flash -->
    <g transform="translate(760 262)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;26 -4;26 -4;0 0" keyTimes="0;0.38;0.44;0.6;1" dur="4s" repeatCount="indefinite"/>
        <use href="#beast"/>
        <use href="#beast" opacity="0" style="filter:brightness(4)">
          <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.38;0.41;0.5;1" dur="4s" repeatCount="indefinite"/>
        </use>
      </g>
    </g>

    <!-- afterimages of the lunge -->
    <g transform="translate(500 262)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.35;0;0" keyTimes="0;0.3;0.36;0.5;1" dur="4s" repeatCount="indefinite"/>
      <use href="#hunter" fill="#8b5cf6" transform="translate(30 0)"/>
    </g>

    <!-- hunter lunge -->
    <g transform="translate(500 262)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;150 -6;150 -6;0 0" keyTimes="0;0.3;0.38;0.55;1" dur="4s" repeatCount="indefinite"/>
        <use href="#hunter" filter="url(#glow)" opacity="0.6"/>
        <use href="#hunter"/>
      </g>
    </g>

    <!-- slash and impact -->
    <path d="M650 110Q735 150 708 238" fill="none" stroke="#f5f3ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="170" stroke-dashoffset="170" opacity="0">
      <animate attributeName="stroke-dashoffset" values="170;170;0;-170;-170" keyTimes="0;0.36;0.42;0.5;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.36;0.42;0.5;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M650 110Q735 150 708 238" fill="none" stroke="#a855f7" stroke-width="12" stroke-linecap="round" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.36;0.42;0.52;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="712" cy="170" r="0" fill="none" stroke="#e879f9" stroke-width="3">
      <animate attributeName="r" values="0;0;46;46" keyTimes="0;0.4;0.52;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.4;0.41;0.52;1" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- particles -->
    <g fill="#c4b5fd">
      <circle cx="470" r="1.6"><animate attributeName="cy" values="270;60" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="540" r="1.2"><animate attributeName="cy" values="270;40" dur="6.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6.5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="640" r="1.8"><animate attributeName="cy" values="270;50" dur="5.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="700" r="1.3"><animate attributeName="cy" values="270;30" dur="7s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="820" r="1.5"><animate attributeName="cy" values="270;40" dur="6s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- outer frame -->
  <path d="M16 1H884L899 16V284L884 299H16L1 284V16Z" fill="none" stroke="#8b5cf6" stroke-opacity="0.6"/>
  <path d="M1 40V16L16 1H60M840 1H884L899 16V40M899 260V284L884 299H840M60 299H16L1 284V260" fill="none" stroke="#c4b5fd" stroke-width="2"/>

  <!-- system window overlay -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace">
    <path d="M40 30H330L344 44V214L330 228H40L26 214V44Z" fill="#07060b" fill-opacity="0.82" stroke="#a78bfa" stroke-opacity="0.8"/>
    <path d="M26 64V44L40 30H70M300 228H330L344 214V194" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <text x="44" y="56" font-size="11" fill="#60a5fa" letter-spacing="4">[ SYSTEM ]</text>
    <circle cx="284" cy="52" r="4" fill="#60a5fa"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="294" y="56" font-size="9" fill="#60a5fa" letter-spacing="2">ON</text>
    <line x1="44" y1="66" x2="326" y2="66" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <g font-size="12">
      <text x="44" y="92" fill="#9b95b8">PLAYER</text><text x="124" y="92" fill="#f5f3ff">wesleysouza-lab</text>
      <text x="44" y="116" fill="#9b95b8">NAME</text><text x="124" y="116" fill="#ede9fe">Wesley Souza</text>
      <text x="44" y="140" fill="#9b95b8">CLASS</text><text x="124" y="140" fill="#c4b5fd">SHADOW MONARCH</text>
      <text x="44" y="164" fill="#9b95b8">SYSTEM</text><text x="124" y="164" fill="#60a5fa">ONLINE</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.48;0.8;0.86" dur="4s" repeatCount="indefinite"/>
      <path d="M52 182H184L192 190V206H52L44 198V190Z" fill="#2a0f3a" stroke="#e879f9"/>
      <text x="118" y="199" font-size="12" font-weight="700" fill="#fdf4ff" text-anchor="middle" letter-spacing="3">LEVEL UP!</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.92;1" dur="8s" repeatCount="indefinite"/>
      <path d="M200 182H322L330 190V206H200Z" fill="#0c1a33" stroke="#60a5fa"/>
      <text x="265" y="198" font-size="8.5" fill="#dbeafe" text-anchor="middle" letter-spacing="1">NEW QUEST AVAILABLE</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="4" font-size="24">
    <text x="26" y="268" fill="#8b5cf6" filter="url(#glow)">WESLEY SOUZA</text>
    <text x="26" y="268" fill="#f5f3ff">WESLEY SOUZA</text>
  </g>
  <text x="26" y="286" font-family="'JetBrains Mono',Consolas,monospace" font-size="10" fill="#9b95b8" letter-spacing="2">DATA ENGINEER · PLAYER HAS AWAKENED</text>
</svg>

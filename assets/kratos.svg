<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Ghost of Sparta: a tribute. The Leviathan axe and the Blades of Chaos, from Olympus to Midgard.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070b"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
<linearGradient id="trio" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1fe0ff"/><stop offset=".5" stop-color="#c9a24b"/><stop offset="1" stop-color="#8b7cf6"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa6bd"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".028"/></pattern><linearGradient id="rage" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d0312d"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient><style>.fill{animation:e 2.2s ease-in-out infinite}.ember{animation:e 2.6s ease-in-out infinite}@keyframes e{50%{opacity:.45}}</style></defs>
<rect x=".5" y=".5" width="899" height="329" rx="12" fill="#0c111c" stroke="#1c2538"/>
<rect x="1" y="1" width="898" height="3" rx="1.5" fill="url(#rage)"/>
<rect x="1" y="20" width="5" height="290" rx="2.5" fill="#d0312d" opacity=".85"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <g transform="translate(640 250) rotate(-24)" stroke="#ff7a3d" stroke-width="2.2" class="ember"><path d="M0 0V-18M-9 -18H9M-5 -18Q-16 -72 12 -118Q0 -72 6 -18Z"/></g>
  <g transform="translate(700 250) rotate(24)" stroke="#ff7a3d" stroke-width="2.2" class="ember"><path d="M0 0V-18M-9 -18H9M-5 -18Q-16 -72 12 -118Q0 -72 6 -18Z"/></g>
  <g stroke="#ff7a3d" stroke-width="1.4" stroke-opacity=".6"><polyline points="640.0,252.0 634.3,265.5 628.6,278.1 622.9,289.2 617.1,298.3 611.4,305.5 605.7,311.2 600.0,316.0" stroke-dasharray="5 3"/><polyline points="700.0,252.0 708.6,265.5 717.1,278.1 725.7,289.2 734.3,298.3 742.9,305.5 751.4,311.2 760.0,316.0" stroke-dasharray="5 3"/></g>
  <g stroke="#a9d6ee" stroke-width="2.4" transform="translate(-34 0)">
    <path d="M790 300L846 54"/>
    <path d="M843 70L872 58C892 76 896 116 878 140L834 110Z"/>
    <path d="M858 72C870 86 874 108 866 124"/>
    <path d="M796 272L804 276M800 256L808 260"/>
  </g>
</g>
<text x="56" y="66" font-family="'Consolas','SF Mono','Courier New',monospace" font-size="12" letter-spacing="6" fill="#d0312d">GHOST OF SPARTA PROTOCOL</text>
<text x="56" y="114" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="1" fill="url(#silver)">From Olympus to Midgard</text>
<text x="56" y="146" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="16" fill="#8f9ab0">Greek strategy and Norse architecture, forged into one.</text>
<text x="56" y="196" font-family="'Consolas','SF Mono','Courier New',monospace" font-size="11" letter-spacing="4" fill="#8f9ab0">RAGE METER</text>
<rect x="56" y="206" width="460" height="10" rx="5" fill="#1a1f2c"/>
<rect class="fill" x="56" y="206" width="460" height="10" rx="5" fill="url(#rage)"/>
<text x="56" y="252" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e8ecf3"><tspan fill="#a9d6ee">▪</tspan>  Leviathan axe: cold, precise refactoring</text>
<text x="56" y="280" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e8ecf3"><tspan fill="#ff7a3d">▪</tspan>  Blades of Chaos: hunting bugs at full speed</text>
<text x="56" y="308" font-family="'Consolas','SF Mono','Courier New',monospace" font-size="10" letter-spacing="2" fill="#5b6478">FAN TRIBUTE. KRATOS AND GOD OF WAR BELONG TO SONY INTERACTIVE ENTERTAINMENT.</text>
</svg>
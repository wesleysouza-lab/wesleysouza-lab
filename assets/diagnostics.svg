<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="System diagnostics: capability levels">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f8fb8"/>
      <stop offset="1" stop-color="#5fe6ff"/>
    </linearGradient>
    <style>
      .bg { fill: #050d17; stroke: #0e3a52; stroke-width: 2; }
      .head { font: 700 14px 'Consolas', 'Courier New', monospace; fill: #ffc83d; letter-spacing: 5px; }
      .lbl { font: 400 15px 'Consolas', 'Courier New', monospace; fill: #cdeff8; }
      .pct { font: 700 15px 'Consolas', 'Courier New', monospace; fill: #5fe6ff; }
      .track { fill: #0b2433; }
      .fill { fill: url(#bar); transform-origin: left; animation: grow 1.8s ease-out both; }
      .tick { stroke: #050d17; stroke-width: 2; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="898" height="248" rx="6"/>
  <text x="30" y="36" class="head">// SYSTEM DIAGNOSTICS</text>

  <text x="30" y="78" class="lbl">PYTHON</text>
  <rect class="track" x="230" y="64" width="560" height="14"/>
  <rect class="fill" x="230" y="64" width="504" height="14"/>
  <text x="810" y="77" class="pct">90%</text>

  <text x="30" y="112" class="lbl">BIGQUERY / SQL</text>
  <rect class="track" x="230" y="98" width="560" height="14"/>
  <rect class="fill" x="230" y="98" width="476" height="14"/>
  <text x="810" y="111" class="pct">85%</text>

  <text x="30" y="146" class="lbl">CLOUD RUN / GCP</text>
  <rect class="track" x="230" y="132" width="560" height="14"/>
  <rect class="fill" x="230" y="132" width="420" height="14"/>
  <text x="810" y="145" class="pct">75%</text>

  <text x="30" y="180" class="lbl">AI AGENTS / CLAUDE</text>
  <rect class="track" x="230" y="166" width="560" height="14"/>
  <rect class="fill" x="230" y="166" width="448" height="14"/>
  <text x="810" y="179" class="pct">80%</text>

  <text x="30" y="214" class="lbl">DASHBOARDS / API</text>
  <rect class="track" x="230" y="200" width="560" height="14"/>
  <rect class="fill" x="230" y="200" width="392" height="14"/>
  <text x="810" y="213" class="pct">70%</text>

  <g class="tick">
    <line x1="370" y1="60" x2="370" y2="218"/><line x1="510" y1="60" x2="510" y2="218"/><line x1="650" y1="60" x2="650" y2="218"/>
  </g>
</svg>

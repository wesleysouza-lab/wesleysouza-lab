<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" aria-label="III · STRATEGY · GREEK. Athena is the goddess of strategy, not of brute force. I use AI agents the same way: they read, draft and prepare the work, and a person reviews and decides every merge. Decisions, context and runbooks live in an Obsidian vault, so knowledge outlives any single session.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070b"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
<linearGradient id="trio" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1fe0ff"/><stop offset=".5" stop-color="#c9a24b"/><stop offset="1" stop-color="#8b7cf6"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa6bd"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".028"/></pattern></defs><rect x=".5" y=".5" width="899" height="175" rx="12" fill="#0c111c" stroke="#1c2538"/>
<rect x="1" y="20" width="3" height="136" rx="1.5" fill="#8b7cf6"/>
<text x="36" y="38" font-family="'Consolas','SF Mono','Courier New',monospace" font-size="11" letter-spacing="5" fill="#8b7cf6">III · STRATEGY · GREEK</text><text x="36" y="70" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e8ecf3">Athena is the goddess of strategy, not of brute force. I use AI agents the same way:</text><text x="36" y="96" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e8ecf3">they read, draft and prepare the work, and a person reviews and decides every merge.</text><text x="36" y="122" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e8ecf3">Decisions, context and runbooks live in an Obsidian vault, so knowledge outlives</text><text x="36" y="148" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e8ecf3">any single session.</text></svg>
    <g fill="#0d141c" stroke="#f59e0b" stroke-width="1.2">
      <rect x="190" y="236" width="300" height="38"/>
    </g>
    <text x="204" y="259" font-size="12" fill="#e2e8f0">CI quality gate · ruff · tests ≥ 80% · secrets scan</text>
    <path d="M255 236V192M425 236V192" stroke="#f59e0b" stroke-dasharray="4 4" fill="none"/>

    <g fill="#0d141c" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3">
      <rect x="530" y="36" width="130" height="44"/>
    </g>
    <text x="540" y="62" font-size="12" fill="#94a3b8">Claude · AI agents</text>
    <path d="M595 80V108" stroke="#64748b" stroke-dasharray="4 4" fill="none"/>

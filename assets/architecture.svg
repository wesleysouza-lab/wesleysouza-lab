<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="Animated data flow: sources, ingestion jobs, BigQuery, FastAPI services and dashboards, guarded by a CI quality gate and assisted by AI agents">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#22d3ee" stroke-opacity="0.06"/>
    </pattern>
    <pattern id="ruler" width="20" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0V10M10 0V5" stroke="#22d3ee" stroke-opacity="0.35"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="20 0" dur="1.2s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="gateClip"><rect x="190" y="272" width="470" height="56"/></clipPath>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="860" height="380" fill="#080c11"/>
  <rect width="860" height="380" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="859" height="379" fill="none" stroke="#22d3ee" stroke-opacity="0.5"/>
  <path d="M0 22V0H22M838 0H860V22M860 358V380H838M22 380H0V358" fill="none" stroke="#22d3ee" stroke-width="2.5"/>

  <!-- floating particles -->
  <g fill="#22d3ee">
    <circle cx="70" cy="330" r="1.5" opacity="0.5"><animate attributeName="cy" values="340;40" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="340" r="1.2" opacity="0.5"><animate attributeName="cy" values="350;40" dur="11s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="330" r="1.5" opacity="0.5"><animate attributeName="cy" values="340;40" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="345" r="1.2" opacity="0.5"><animate attributeName="cy" values="350;40" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="335" r="1.5" opacity="0.5"><animate attributeName="cy" values="345;40" dur="9.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="9.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="340" r="1.2" opacity="0.5"><animate attributeName="cy" values="350;40" dur="12s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="12s" begin="4s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'JetBrains Mono',Consolas,'Courier New',monospace">
    <text x="22" y="28" font-size="11" fill="#22d3ee" letter-spacing="3">SYSTEM ARCHITECTURE</text>
    <text x="192" y="28" font-size="11" fill="#64748b" letter-spacing="2">// live data flow</text>
    <rect x="320" y="19" width="7" height="12" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <circle cx="824" cy="24" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="812" y="28" font-size="10" fill="#22c55e" text-anchor="end" letter-spacing="3">FLOWING</text>

    <!-- AI agents -->
    <g>
      <rect x="300" y="52" width="260" height="40" fill="#0d141c" stroke="#94a3b8" stroke-dasharray="4 3">
        <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="316" y="68" font-size="9" fill="#f59e0b" letter-spacing="2">AGENTS</text>
      <text x="316" y="83" font-size="12" fill="#e2e8f0">Claude Code · prepares, humans decide</text>
      <circle r="3" fill="#f59e0b"><animateMotion dur="5s" repeatCount="indefinite" path="M300 52H560V92H300Z"/></circle>
    </g>
    <g stroke="#94a3b8" stroke-dasharray="4 4" fill="none">
      <path d="M300 72H255V130"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M560 72H595V130"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/></path>
    </g>

    <!-- nodes -->
    <g fill="#0d141c" stroke="#22d3ee" stroke-width="1.2">
      <rect x="20"  y="130" width="130" height="94"/>
      <rect x="190" y="130" width="130" height="94"/>
      <rect x="360" y="130" width="130" height="94"/>
      <rect x="530" y="130" width="130" height="94"/>
      <rect x="700" y="130" width="140" height="94"/>
    </g>
    <g fill="none" stroke="#22d3ee" stroke-width="2.5">
      <path d="M20 146V130H36M134 130H150V146M150 208V224H134M36 224H20V208"/>
      <path d="M190 146V130H206M304 130H320V146M320 208V224H304M206 224H190V208"/>
      <path d="M360 146V130H376M474 130H490V146M490 208V224H474M376 224H360V208"/>
      <path d="M530 146V130H546M644 130H660V146M660 208V224H644M546 224H530V208"/>
      <path d="M700 146V130H716M824 130H840V146M840 208V224H824M716 224H700V208"/>
    </g>

    <!-- labels -->
    <g fill="#f59e0b" font-size="9" letter-spacing="2">
      <text x="32" y="150">SOURCES</text>
      <text x="202" y="150">INGEST</text>
      <text x="372" y="150">STORE</text>
      <text x="542" y="150">SERVE</text>
      <text x="712" y="150">INTERFACE</text>
    </g>
    <g fill="#f1f5f9" font-size="15" font-weight="700">
      <text x="32" y="186">SAP HANA</text>
      <text x="202" y="186">Python</text>
      <text x="372" y="186">BigQuery</text>
      <text x="542" y="186">FastAPI</text>
      <text x="712" y="186">Dashboards</text>
    </g>
    <g fill="#94a3b8" font-size="11">
      <text x="32" y="206">APIs · Sheets</text>
      <text x="202" y="206">Poetry · Cloud Run</text>
      <text x="372" y="206">raw → core → dm</text>
      <text x="542" y="206">Cloud Run</text>
      <text x="712" y="206">Web · Logistics</text>
    </g>

    <!-- animated icons -->
    <g fill="#22d3ee">
      <rect x="112" y="141" width="22" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="112" y="147" width="16" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="112" y="153" width="20" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="none" stroke="#22d3ee">
      <g>
        <circle cx="292" cy="148" r="8" stroke-width="4" stroke-dasharray="3.3 2.2"/>
        <circle cx="292" cy="148" r="4" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0 292 148" to="360 292 148" dur="6s" repeatCount="indefinite"/>
      </g>
      <g stroke-width="1.5">
        <path d="M453 142V154M471 142V154"/>
        <ellipse cx="462" cy="142" rx="9" ry="3"/>
        <path d="M453 154A9 3 0 0 0 471 154"/>
      </g>
      <circle cx="632" cy="148" r="9" stroke-width="1.5"/>
      <circle cx="632" cy="148" r="4" stroke-width="1" stroke-opacity="0.6"/>
    </g>
    <rect x="454" y="153" width="16" height="0" fill="#22d3ee" fill-opacity="0.55">
      <animate attributeName="y" values="153;143;143;153" keyTimes="0;0.6;0.9;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;10;10;0" keyTimes="0;0.6;0.9;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <path d="M632 148L640 142" stroke="#f59e0b" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0 632 148" to="360 632 148" dur="3s" repeatCount="indefinite"/>
    </path>
    <g fill="#22d3ee">
      <rect x="800" y="145" width="5" height="10"><animate attributeName="y" values="145;139;145" dur="1.8s" repeatCount="indefinite"/><animate attributeName="height" values="10;16;10" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="808" y="141" width="5" height="14"><animate attributeName="y" values="141;147;141" dur="1.8s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="height" values="14;8;14" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="816" y="143" width="5" height="12"><animate attributeName="y" values="143;139;143" dur="1.8s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="height" values="12;16;12" dur="1.8s" begin="0.8s" repeatCount="indefinite"/></rect>
    </g>

    <!-- sequential node flash, synced with the scan beam -->
    <g stroke="#a5f3fc" stroke-width="2" fill="#22d3ee">
      <rect x="20" y="130" width="130" height="94" fill-opacity="0" stroke-opacity="0"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="0.65s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="0.65s" repeatCount="indefinite"/></rect>
      <rect x="190" y="130" width="130" height="94" fill-opacity="0" stroke-opacity="0"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="1.73s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="1.73s" repeatCount="indefinite"/></rect>
      <rect x="360" y="130" width="130" height="94" fill-opacity="0" stroke-opacity="0"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="2.82s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="2.82s" repeatCount="indefinite"/></rect>
      <rect x="530" y="130" width="130" height="94" fill-opacity="0" stroke-opacity="0"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="3.9s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="3.9s" repeatCount="indefinite"/></rect>
      <rect x="700" y="130" width="140" height="94" fill-opacity="0" stroke-opacity="0"><animate attributeName="fill-opacity" values="0;0.28;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="5.02s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;1;0;0" keyTimes="0;0.06;0.24;1" dur="6s" begin="5.02s" repeatCount="indefinite"/></rect>
    </g>

    <!-- connections -->
    <g stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.5" fill="none">
      <path d="M150 190H190"/><path d="M320 190H360"/><path d="M490 190H530"/><path d="M660 190H700"/>
    </g>
    <g stroke="#22d3ee" stroke-width="1.5" fill="none" stroke-dasharray="5 5">
      <path d="M150 190H190"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/></path>
      <path d="M320 190H360"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/></path>
      <path d="M490 190H530"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/></path>
      <path d="M660 190H700"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/></path>
    </g>

    <!-- data packets with trails -->
    <g fill="#f59e0b">
      <circle r="3.5"><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite" path="M150 190H190"/></circle>
      <circle r="3" opacity="0.6"><animateMotion dur="1.5s" begin="0.1s" repeatCount="indefinite" path="M150 190H190"/></circle>
      <circle r="2.5" opacity="0.3"><animateMotion dur="1.5s" begin="0.2s" repeatCount="indefinite" path="M150 190H190"/></circle>
      <circle r="3.5"><animateMotion dur="1.5s" begin="0.375s" repeatCount="indefinite" path="M320 190H360"/></circle>
      <circle r="3" opacity="0.6"><animateMotion dur="1.5s" begin="0.475s" repeatCount="indefinite" path="M320 190H360"/></circle>
      <circle r="2.5" opacity="0.3"><animateMotion dur="1.5s" begin="0.575s" repeatCount="indefinite" path="M320 190H360"/></circle>
      <circle r="3.5"><animateMotion dur="1.5s" begin="0.75s" repeatCount="indefinite" path="M490 190H530"/></circle>
      <circle r="3" opacity="0.6"><animateMotion dur="1.5s" begin="0.85s" repeatCount="indefinite" path="M490 190H530"/></circle>
      <circle r="2.5" opacity="0.3"><animateMotion dur="1.5s" begin="0.95s" repeatCount="indefinite" path="M490 190H530"/></circle>
      <circle r="3.5"><animateMotion dur="1.5s" begin="1.125s" repeatCount="indefinite" path="M660 190H700"/></circle>
      <circle r="3" opacity="0.6"><animateMotion dur="1.5s" begin="1.225s" repeatCount="indefinite" path="M660 190H700"/></circle>
      <circle r="2.5" opacity="0.3"><animateMotion dur="1.5s" begin="1.325s" repeatCount="indefinite" path="M660 190H700"/></circle>
    </g>
    <g fill="#f59e0b" filter="url(#soft)" opacity="0.8">
      <circle r="5"><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite" path="M150 190H190"/></circle>
      <circle r="5"><animateMotion dur="1.5s" begin="0.375s" repeatCount="indefinite" path="M320 190H360"/></circle>
      <circle r="5"><animateMotion dur="1.5s" begin="0.75s" repeatCount="indefinite" path="M490 190H530"/></circle>
      <circle r="5"><animateMotion dur="1.5s" begin="1.125s" repeatCount="indefinite" path="M660 190H700"/></circle>
    </g>

    <!-- scan beam across the whole flow -->
    <rect x="-80" y="34" width="80" height="302" fill="url(#beam)">
      <animate attributeName="x" from="-80" to="860" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- CI quality gate -->
    <rect x="190" y="272" width="470" height="56" fill="#0d141c" stroke="#f59e0b" stroke-width="1.2"/>
    <g clip-path="url(#gateClip)">
      <rect x="190" y="272" width="110" height="56" fill="url(#scan)">
        <animate attributeName="x" values="80;660" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="206" y="290" font-size="9" fill="#f59e0b" letter-spacing="3">CI · QUALITY GATE</text>
    <g font-size="12" fill="#e2e8f0">
      <text x="206" y="313">ruff</text>
      <text x="300" y="313">tests ≥ 80%</text>
      <text x="438" y="313">secrets scan</text>
      <text x="540" y="313">human merge</text>
    </g>
    <g font-size="12" fill="#22c55e" font-weight="700">
      <text x="245" y="313" opacity="0">✓<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="0s" repeatCount="indefinite"/></text>
      <text x="381" y="313" opacity="0">✓<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="0.6s" repeatCount="indefinite"/></text>
      <text x="520" y="313" opacity="0">✓<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="1.2s" repeatCount="indefinite"/></text>
      <text x="632" y="313" opacity="0">✓<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="1.8s" repeatCount="indefinite"/></text>
    </g>
    <g stroke="#f59e0b" stroke-dasharray="4 4" fill="none">
      <path d="M255 272V226"><animate attributeName="stroke-dashoffset" from="0" to="16" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M425 272V226"><animate attributeName="stroke-dashoffset" from="0" to="16" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M595 272V226"><animate attributeName="stroke-dashoffset" from="0" to="16" dur="1.2s" repeatCount="indefinite"/></path>
    </g>

    <!-- bottom ruler and footnote -->
    <rect x="20" y="344" width="820" height="10" fill="url(#ruler)"/>
    <text x="840" y="372" font-size="9" fill="#64748b" text-anchor="end" letter-spacing="1">generic flow · internal repositories are private</text>
  </g>
</svg>

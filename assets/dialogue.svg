<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="A short conversation between Wesley and the assistant about how he works">
  <defs>
    <style>
      .bg { fill: #16181d; }
      .you { fill: #2c2f36; }
      .ai { fill: #3a1219; stroke: #c8102e; stroke-width: 1.5; }
      .who { font: 600 11px 'Consolas', 'Courier New', monospace; letter-spacing: 3px; }
      .t { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #f4efe6; }
      .l1 { opacity: 0; animation: show .6s ease-out .3s forwards; }
      .l2 { opacity: 0; animation: show .6s ease-out 1.4s forwards; }
      .l3 { opacity: 0; animation: show .6s ease-out 2.5s forwards; }
      .l4 { opacity: 0; animation: show .6s ease-out 3.6s forwards; }
      @keyframes show { to { opacity: 1; } }
    </style>
  </defs>
  <rect class="bg" width="900" height="250" rx="8"/>

  <g class="l1">
    <rect class="you" x="28" y="20" width="430" height="44" rx="10"/>
    <text class="who" x="44" y="36" fill="#b9a99a">WESLEY</text>
    <text class="t" x="44" y="55">How do we ship something safely?</text>
  </g>
  <g class="l2">
    <rect class="ai" x="300" y="74" width="572" height="44" rx="10"/>
    <text class="who" x="316" y="90" fill="#f5b700">ASSISTANT</text>
    <text class="t" x="316" y="109">Small jobs, tests with mocks, and a quality gate on every pull request.</text>
  </g>
  <g class="l3">
    <rect class="you" x="28" y="128" width="430" height="44" rx="10"/>
    <text class="who" x="44" y="144" fill="#b9a99a">WESLEY</text>
    <text class="t" x="44" y="163">And who decides the merge?</text>
  </g>
  <g class="l4">
    <rect class="ai" x="300" y="182" width="572" height="44" rx="10"/>
    <text class="who" x="316" y="198" fill="#f5b700">ASSISTANT</text>
    <text class="t" x="316" y="217">A human. Always. I only prepare the work.</text>
  </g>
</svg>
